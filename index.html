<style>

html,body{

  pointer-events:none;

/* =========================================================
   BUILDINGS
========================================================= */

function building(
  x,
  z,
  w,
  h,
  d,
  color
){

  const group =
    new THREE.Group();

  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      mat(color)
    );

  body.position.y =
    h/2;

  body.castShadow = true;

  body.receiveShadow = true;

  group.add(body);


  const cols =
    Math.max(
      1,
      Math.floor(w/2.5)
    );

  const rows =
    Math.max(
      1,
      Math.floor(h/3)
    );


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      if(
        Math.random()<.18
      ){
        continue;
      }


      const wx =
        -w/2+
        1.1+
        c*2.3;

      const wy =
        1.4+
        r*2.5;


      if(
        wx>w/2-.5
      ){
        continue;
      }


      const win =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            .58,
            .75
          ),
          new THREE.MeshBasicMaterial({
            color:
              Math.random()>.35
                ?0xffc965
                :0x8dc7ff
          })
        );


      win.position.set(
        wx,
        wy,
        d/2+.01
      );

      group.add(win);


      const back =
        win.clone();

      back.position.z =
        -d/2-.01;

      back.rotation.y =
        Math.PI;

      group.add(back);
    }
  }


  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);
}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;
let masterGain = null;

function initAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    masterGain =
      audioCtx.createGain();

    masterGain.gain.value = .45;

    masterGain.connect(
      audioCtx.destination
    );
  }

  if(
    audioCtx.state === "suspended"
  ){

    audioCtx.resume();
  }
}


function tone(
  frequency,
  duration,
  type="sine",
  volume=.08,
  endFrequency=null
){

  if(!audioCtx)
    return;


  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();


  osc.type =
    type;


  osc.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime
  );


  if(
    endFrequency !== null
  ){

    osc.frequency.exponentialRampToValueAtTime(
      endFrequency,
      audioCtx.currentTime+
      duration
    );
  }


  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+
    duration
  );


  osc.connect(gain);

  gain.connect(
    masterGain
  );


  osc.start();

  osc.stop(
    audioCtx.currentTime+
    duration
  );
}


function noise(
  duration=.08,
  volume=.12,
  filterFrequency=1400
){

  if(!audioCtx)
    return;


  const length =
    Math.floor(
      audioCtx.sampleRate*
      duration
    );


  const buffer =
    audioCtx.createBuffer(
      1,
      length,
      audioCtx.sampleRate
    );


  const data =
    buffer.getChannelData(0);


  for(
    let i=0;
    i<length;
    i++
  ){

    data[i] =
      (Math.random()*2-1)*
      (1-i/length);
  }


  const source =
    audioCtx.createBufferSource();

  source.buffer =
    buffer;


  const filter =
    audioCtx.createBiquadFilter();

  filter.type =
    "lowpass";

  filter.frequency.value =
    filterFrequency;


  const gain =
    audioCtx.createGain();

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+
    duration
  );


  source.connect(filter);

  filter.connect(gain);

  gain.connect(masterGain);


  source.start();

  source.stop(
    audioCtx.currentTime+
    duration
  );
}

    color:0xd6cea4,
    roughness:.8
  });


function zpart(
  z,
  geo,
  material,
  x,y,zp,
  rx=0,
  ry=0,
  rz=0
){

  const m =
    new THREE.Mesh(
      geo,
      material
    );


  m.position.set(
    x,y,zp
  );


  m.rotation.set(
    rx,ry,rz
  );


  m.castShadow =
    true;


  z.add(m);

  return m;
}


function spawnZombie(){

  const roll =
    Math.random();


  let type =
    "normal";


  if(
    roll<.17
  ){

    type =
      "runner";

  }
  else if(
    roll<.29
  ){

    type =
      "brute";
  }


  const z =
    new THREE.Group();


  z.userData.isZombie =
    true;

  z.userData.type =
    type;


  let scale=1;
  let hpMax=1;
  let speed =
    .026+
    Math.random()*.015;

    type==="runner"

    scale=.86;

    hpMax=1;

    speed =
      .05+
      Math.random()*.025;
  }

    type==="brute"

    hpMax=3;

    speed =
      .016+
      Math.random()*.012;

    );

  zpart(
    z,
    new THREE.SphereGeometry(
      .18,10,8
    ),

  );


  zpart(
    z,
    new THREE.BoxGeometry(

  zpart(
    z,

  zpart(

    new THREE.SphereGeometry(

  );


  zpart(

  zpart(

    camera.position.x+
      Math.cos(angle)*

    camera.position.z+
      Math.sin(angle)*
      distance
  );


  scene.add(z);

  zombies.push(z);

/* =========================================================
   WAVE
========================================================= */

function spawnWave(){

  if(!playing)
    return;


  soundWave();

  let amount =
    3+
    wave*2;


  let spawned=0;


  const timer =
    setInterval(
      ()=>{
        if(!playing){

          clearInterval(
            timer
          );

          return;
        }


        spawnZombie();

        spawned++;


        if(
          spawned>=amount
        ){

          clearInterval(
            timer
          );
        }

      },
      420
    );
}


/* =========================================================
   BLOOD PARTICLES
========================================================= */

function bloodBurst(
  point
){

  for(
    let i=0;
    i<12;
    i++
  ){

    const p =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .035+
          Math.random()*.045,
          6,
          6
        ),
        new THREE.MeshBasicMaterial({
          color:
            Math.random()>.35
              ?0xbd1b1b
              :0x6d0808
        })
      );


    p.position.copy(
      point
    );


    p.userData.velocity =
      new THREE.Vector3(
        (Math.random()-.5)*2,
        Math.random()*2,
        (Math.random()-.5)*2
      );


    p.userData.life =
      .3+
      Math.random()*.3;


    scene.add(p);

    particles.push(p);
  }
}


/* =========================================================
   SHOOT
========================================================= */

function shoot(){

  if(
    !playing ||
    shootCooldown>0
  ){

    return;
  }


  shootCooldown =
    .16;

  recoil =
    .12;


  soundGun();


  muzzle.visible =
    true;


  setTimeout(
    ()=>{
      muzzle.visible=false;
    },
    45
  );


  raycaster.setFromCamera(
    new THREE.Vector2(
      0,
      0
    ),
    camera
  );


  const objects=[];


  zombies.forEach(
    z=>{
      z.traverse(
        obj=>{
          if(obj.isMesh)
            objects.push(obj);
        }
      );
    }
  );


  const hits =
    raycaster.intersectObjects(
      objects,
      false
    );


  if(
    hits.length===0
  ){

    return;
  }


  let target =
    hits[0].object;


  while(
    target.parent &&
    !target.userData.isZombie
  ){

    target =
      target.parent;
  }


  if(
    !target.userData.isZombie
  ){

    return;
  }


  target.userData.hp--;


  soundHit();


  bloodBurst(
    hits[0].point
  );


  const hit =
    document.getElementById(
      "hit"
    );


  hit.style.opacity =
    "1";


  setTimeout(
    ()=>{
      hit.style.opacity =
        "0";
    },
    90
  );


  if(
    target.userData.hp<=0
  ){

    const index =
      zombies.indexOf(
        target
      );


    if(
      index!==-1
    ){

      score +=
        target.userData.type==="brute"
          ?30
          :target.userData.type==="runner"
            ?15
            :10;


      updateHUD();


      setTimeout(
        ()=>{
          scene.remove(
            target
          );
        },
        100
      );


      zombies.splice(
        index,
        1
      );
    }
  }
}


/* =========================================================
   MOVE
========================================================= */

function move(
  delta
){

  if(!playing)
    return;


  const speed =
    6.5*
    delta;


  const forward =
    new THREE.Vector3(
      Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );


  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      Math.sin(yaw)
    );


  const dir =
    new THREE.Vector3();


  if(keys.KeyW)
    dir.add(forward);

  if(keys.KeyS)
    dir.sub(forward);

  if(keys.KeyA)
    dir.sub(right);

  if(keys.KeyD)
    dir.add(right);


  if(
    dir.lengthSq()>0
  ){

    dir.normalize();


    camera.position.addScaledVector(
      dir,
      speed
    );


    walkTime +=
      delta*10;


    footstepTimer -=
      delta;


    if(
      footstepTimer<=0
    ){

      soundStep();

      footstepTimer =
        .34;
    }


    weapon.position.y =
      -.43+
      Math.sin(
        walkTime
      )*.018;


    weapon.position.x =
      .48+
      Math.cos(
        walkTime*.5
      )*.012;
  }


  camera.position.x =
    Math.max(
      -78,
      Math.min(
        78,
        camera.position.x
      )
    );


  camera.position.z =
    Math.max(
      -90,
      Math.min(
        90,
        camera.position.z
      )
    );
}


/* =========================================================
   ZOMBIE UPDATE
========================================================= */

function updateZombies(
  delta
){

  const now =
    performance.now()*
    .001;


  for(
    let i=zombies.length-1;
    i>=0;
    i--
  ){

    const z =
      zombies[i];


    if(
      !z.parent
    ){
      continue;
    }


    const dx =
      camera.position.x-
      z.position.x;


    const dz =
      camera.position.z-
      z.position.z;


    const dist =
      Math.max(
        .001,
        Math.hypot(
          dx,
          dz
        )
      );


    if(
      dist>1.75
    ){

      z.position.x +=
        dx/dist*
        z.userData.speed*
        60*
        delta;


      z.position.z +=
        dz/dist*
        z.userData.speed*
        60*
        delta;


      z.rotation.y =
        Math.atan2(
          dx,
          dz
        );


      const p =
        z.userData.parts;


      const w =
        Math.sin(
          now*7+
          z.userData.phase
        );


      p.armL.rotation.z =
        -.18+
        w*.32;


      p.armR.rotation.z =
        .18-
        w*.32;


      p.legL.rotation.x =
        w*.32;


      p.legR.rotation.x =
        -w*.32;


      p.body.position.y =
        2+
        Math.abs(w)*.025;


      p.head.position.y =
        3.68+
        Math.abs(w)*.025;

    }
    else{

      z.userData.cooldown -=
        delta;


      if(
        z.userData.cooldown<=0
      ){

        hp -=
          z.userData.type==="brute"
            ?12
            :z.userData.type==="runner"
              ?7
              :8;


        z.userData.cooldown =
          .75;


        soundDamage();


        const damage =
          document.getElementById(
            "damage"
          );


        damage.style.opacity =
          "1";


        setTimeout(
          ()=>{
            damage.style.opacity =
              "0";
          },
          120
        );


        updateHUD();


        if(
          hp<=0
        ){

          hp=0;

          updateHUD();

          gameOver();

          return;
        }
      }
    }
  }


  if(
    playing &&
    zombies.length===0 &&
    !waveBusy
  ){

    waveBusy=true;


    nextWaveTimer =
      setTimeout(
        ()=>{
          if(playing){

            wave++;

            updateHUD();

            spawnWave();
          }

          waveBusy=false;
        },
        1700
      );
  }


  updateHUD();
}


/* =========================================================
   PARTICLES
========================================================= */

function updateParticles(
  delta
){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];


    p.position.x +=
      p.userData.velocity.x*
      delta;


    p.position.y +=
      p.userData.velocity.y*
      delta;


    p.position.z +=
      p.userData.velocity.z*
      delta;


    p.userData.velocity.y -=
      8*delta;


    p.userData.life -=
      delta;


    if(
      p.userData.life<=0
    ){

      scene.remove(p);

      particles.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   ZOMBIE SOUND LOOP
========================================================= */

function zombieSoundLoop(){

  if(
    playing &&
    zombies.length>0
  ){

    soundZombie();


    zombieSoundTimer =
      setTimeout(
        zombieSoundLoop,
        3500+
        Math.random()*4500
      );
  }
}


/* =========================================================
   PC KEYBOARD
========================================================= */

addEventListener(
  "keydown",
  e=>{
    keys[e.code]=true;
  }
);


addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);


/* =========================================================
   PC MOUSE AIM
========================================================= */

addEventListener(
  "mousemove",
  e=>{

    if(
      !playing ||
      document.pointerLockElement !==
      renderer.domElement
    ){

      return;
    }


    yaw -=
      e.movementX*
      .0025;


    pitch -=
      e.movementY*
      .0025;


    const limit =
      Math.PI/2-
      .04;


    pitch =
      Math.max(
        -limit,
        Math.min(
          limit,
          pitch
        )
      );


    camera.rotation.y =
      yaw;


    camera.rotation.x =
      pitch;
  }
);


/* =========================================================
   PC SHOOT
========================================================= */

addEventListener(
  "mousedown",
  e=>{

    if(
      e.button===0 &&
      playing &&
      !window.matchMedia(
        "(max-width:900px)"
      ).matches
    ){

      shoot();
    }
  }
);


/* =========================================================
   POINTER LOCK PC
========================================================= */

renderer.domElement.addEventListener(
  "click",
  ()=>{

    if(
      playing &&
      !window.matchMedia(
        "(max-width:900px)"
      ).matches &&
      document.pointerLockElement !==
      renderer.domElement
    ){

      renderer.domElement.requestPointerLock();
    }
  }
);


/* =========================================================
   MOBILE MOVEMENT
========================================================= */

document.querySelectorAll(
  ".mbtn"
).forEach(
  button=>{

    const code =
      button.dataset.key;


    button.addEventListener(
      "touchstart",
      e=>{

        e.preventDefault();

        keys[code]=true;
      },
      {
        passive:false
      }
    );


    button.addEventListener(
      "touchend",
      e=>{

        e.preventDefault();

        keys[code]=false;
      },
      {
        passive:false
      }
    );


    button.addEventListener(
      "touchcancel",
      e=>{

        e.preventDefault();

        keys[code]=false;
      },
      {
        passive:false
      }
    );
  }
);


/* =========================================================
   MOBILE AIM
========================================================= */

const lookZone =
  document.getElementById(
    "lookZone"
  );


let lastTouchX = 0;
let lastTouchY = 0;


lookZone.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    const t =
      e.touches[0];

    lastTouchX =
      t.clientX;

    lastTouchY =
      t.clientY;
  },
  {
    passive:false
  }
);


lookZone.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    if(!playing)
      return;


    const t =
      e.touches[0];


    const dx =
      t.clientX-
      lastTouchX;


    const dy =
      t.clientY-
      lastTouchY;


    lastTouchX =
      t.clientX;


    lastTouchY =
      t.clientY;


    yaw -=
      dx*.006;


    pitch -=
      dy*.006;


    const limit =
      Math.PI/2-
      .04;


    pitch =
      Math.max(
        -limit,
        Math.min(
          limit,
          pitch
        )
      );


    camera.rotation.y =
      yaw;


    camera.rotation.x =
      pitch;
  },
  {
    passive:false
  }
);

/* =========================================================
   CLEAR
========================================================= */

function clearGame(){

  while(
    zombies.length
  ){

    scene.remove(
      zombies.pop()
    );
  }


  while(
    particles.length
  ){

    scene.remove(
      particles.pop()
    );
  }
}


/* =========================================================
   START
========================================================= */

function startGame(){

  initAudio();


  clearGame();


  if(nextWaveTimer){

    clearTimeout(
      nextWaveTimer
    );

    nextWaveTimer =
      null;
  }


  if(zombieSoundTimer){

    clearTimeout(
      zombieSoundTimer
    );

    zombieSoundTimer =
      null;
  }


  hp=100;

  score=0;

  wave=1;

  yaw=0;

  pitch=0;

  waveBusy=false;


  camera.position.set(
    0,
    1.7,
    8
  );


  camera.rotation.set(
    0,
    0,
    0
  );


  weapon.position.set(
    .48,
    -.43,
    -.85
  );


  playing=true;


  updateHUD();


  document.getElementById(
    "start"
  ).style.display =
    "none";


  spawnWave();


  setTimeout(
    zombieSoundLoop,
    2500
  );


  /* pointer lock hanya PC */

  if(
    !window.matchMedia(
      "(max-width:900px)"
    ).matches
  ){

    renderer.domElement.requestPointerLock();
  }
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

  playing=false;


  if(nextWaveTimer){

    clearTimeout(
      nextWaveTimer
    );

    nextWaveTimer=null;
  }


  if(zombieSoundTimer){

    clearTimeout(
      zombieSoundTimer
    );

    zombieSoundTimer=null;
  }


  soundGameOver();


  if(
    document.pointerLockElement
  ){

    document.exitPointerLock();
  }


  const start =
    document.getElementById(
      "start"
    );


  start.style.display =
    "flex";


  start.innerHTML =
  `
    <div class="card">

      <div class="logo">
        GAME <span>OVER</span>
      </div>

      <div class="sub">
        NIGHTFALL PROTOCOL TERMINATED
      </div>

      <div class="info">
        🎯 SCORE: ${score}<br>
        🌊 WAVE: ${wave}
      </div>

      <button id="restartBtn">
        MAIN LAGI
      </button>

    </div>
  `;


  document.getElementById(
    "restartBtn"
  ).onclick =
    ()=>{
      location.reload();
    };
}


/* =========================================================
   START BUTTON
========================================================= */

document.getElementById(
  "startBtn"
).onclick =
  startGame;


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================================================
   LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  const delta =
    Math.min(
      clock.getDelta(),
      .05
    );


  move(delta);

  updateZombies(delta);

  updateParticles(delta);


  shootCooldown =
    Math.max(
      0,
      shootCooldown-delta
    );


  recoil =
    Math.max(
      0,
      recoil-delta*3.8
    );


  weapon.position.z =
    -.85+
    recoil;


  weapon.rotation.x =
    -.05+
    recoil*.8;


  renderer.render(
    scene,
    camera
  );
}


updateHUD();

animate();

</script>
