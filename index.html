<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Survival 3D</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080d;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:18px;
  left:18px;
  z-index:20;
  width:270px;
  color:#fff;
  pointer-events:none;
  text-shadow:0 2px 6px #000;
}

.hud-title{
  font-size:13px;
  letter-spacing:3px;
  color:#9faec2;
  margin-bottom:7px;
}

.hud-row{
  font-size:19px;
  margin:4px 0;
}

.hp-wrap{
  width:235px;
  height:10px;
  background:#171c22;
  border:1px solid #39414c;
  border-radius:20px;
  overflow:hidden;
  margin:7px 0 10px;
}

#hpBar{
  width:100%;
  height:100%;
  background:linear-gradient(
    90deg,
    #29d45c,
    #a6ef45
  );
  transition:width .15s ease;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:25;
  width:30px;
  height:30px;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 5px #000;
}

#crosshair:before{
  width:2px;
  height:25px;
  left:14px;
  top:2px;
}

#crosshair:after{
  width:25px;
  height:2px;
  left:2px;
  top:14px;
}

#hitMarker{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:26;
  color:#ff5050;
  font-size:26px;
  font-weight:bold;
  opacity:0;
  pointer-events:none;
}

#damageOverlay{
  position:fixed;
  inset:0;
  z-index:22;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(
      circle,
      transparent 35%,
      rgba(255,0,0,.5)
    );
  transition:opacity .08s;
}

#vignette{
  position:fixed;
  inset:0;
  z-index:18;
  pointer-events:none;
  background:
    radial-gradient(
      circle,
      transparent 45%,
      rgba(0,0,0,.42) 100%
    );
}

#weaponHint{

}

.start-card{

========================================================= */

/* =========================================================
   BUILDING
========================================================= */

function building(
  x,
  z,
  w,
  h,
  d,
  color
){

  const group =
    new THREE.Group();

  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      material(
        color,
        1
      )
    );

  body.position.y =
    h/2;

  body.castShadow = true;
  body.receiveShadow = true;

  group.add(body);


  const windowsPerRow =
    Math.max(
      1,
      Math.floor(w/2.5)
    );

  const rows =
    Math.max(
      1,
      Math.floor(h/3)
    );


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<windowsPerRow;
      c++
    ){

      if(
        Math.random()<.18
      ){
        continue;
      }


      const ww=.58;
      const wh=.75;


      const wx =
        -w/2+
        1.1+
        c*2.3;

      const wy =
        1.4+
        r*2.5;


      if(
        wx>w/2-.5
      ){
        continue;
      }


      const win =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            ww,
            wh
          ),
          new THREE.MeshBasicMaterial({
            color:
              Math.random()>.35
                ? COLORS.window
                : COLORS.windowCold
          })
        );


      win.position.set(
        wx,
        wy,
        d/2+.012
      );

      group.add(win);


      const back =
        win.clone();

      back.position.z =
        -d/2-.012;

      back.rotation.y =
        Math.PI;

      group.add(back);
    }
  }


  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);
}

  );

  group.add(light);


  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);
}

/* =========================================================
   AUDIO SYSTEM
========================================================= */

let audioCtx=null;

let masterGain=null;

function initAudio(){

  if(!audioCtx){

    audioCtx=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    masterGain=
      audioCtx.createGain();

    masterGain.gain.value=
      .45;

    masterGain.connect(
      audioCtx.destination
    );
  }


  if(
    audioCtx.state ===
    "suspended"
  ){

    audioCtx.resume();
  }
}


/* white noise */

function noiseBurst(
  duration=.08,
  volume=.15,
  filterFreq=1400
){

  if(!audioCtx)
    return;


  const length=
    Math.max(
      1,
      Math.floor(
        audioCtx.sampleRate*
        duration
      )
    );


  const buffer=
    audioCtx.createBuffer(
      1,
      length,
      audioCtx.sampleRate
    );


  const data=
    buffer.getChannelData(0);


  for(
    let i=0;
    i<length;
    i++
  ){

    data[i]=
      (Math.random()*2-1)*
      (1-i/length);
  }


  const source=
    audioCtx.createBufferSource();

  source.buffer=
    buffer;


  const filter=
    audioCtx.createBiquadFilter();

  filter.type=
    "lowpass";

  filter.frequency.value=
    filterFreq;


  const gain=
    audioCtx.createGain();

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+
    duration
  );


  source.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);


  source.start();

  source.stop(
    audioCtx.currentTime+
    duration
  );
}


/* tone */

function tone(
  frequency,
  duration,
  type="sine",
  volume=.08,
  endFrequency=null
){

  if(!audioCtx)
    return;


  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();


  osc.type=
    type;


  osc.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime
  );


  if(
    endFrequency !== null
  ){

    osc.frequency.exponentialRampToValueAtTime(
      endFrequency,
      audioCtx.currentTime+
      duration
    );
  }


  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+
    duration
  );


  osc.connect(gain);

  gain.connect(masterGain);


  osc.start();

  osc.stop(
    audioCtx.currentTime+
    duration
  );
}


/* gun */

function soundGun(){

  if(!audioCtx)
    return;


  noiseBurst(
    .075,
    .28,
    2200
  );


  tone(
    110,
    .09,
    "sawtooth",
    .20,

  );


  setTimeout(

      tone(
        55,
        .12,
        "square",

}

  material,
  x,y,zpos,

/* =========================================================
   WAVE
========================================================= */

function spawnWave(){

  if(!playing)
    return;


  soundWave();


  let amount=
    3+
    wave*2;


  let spawned=0;


  const interval=
    setInterval(
      ()=>{

        if(!playing){

          clearInterval(
            interval
          );

          return;
        }


        spawnZombie();

        spawned++;


        if(
          spawned>=amount
        ){

          clearInterval(
            interval
          );
        }

      },
      420
    );
}

/* =========================================================
   SHOOT
========================================================= */

function shoot(){

  if(
    !playing ||
    shootCooldown>0
  ){
    return;
  }


  shootCooldown=.16;

  recoil=.12;


  soundGun();


  muzzle.visible=true;


  setTimeout(
    ()=>{
      muzzle.visible=false;
    },
    45
  );


  raycaster.setFromCamera(
    new THREE.Vector2(
      0,
      0
    ),
    camera
  );


  const objects=[];


  zombies.forEach(
    z=>{

      z.traverse(
        o=>{

          if(o.isMesh){
            objects.push(o);
          }
        }
      );

    }
  );


  const hits=
    raycaster.intersectObjects(
      objects,
      false
    );


  if(
    hits.length===0
  ){
    return;
  }


  let target=
    hits[0].object;


  while(
    target.parent &&
    !target.userData.isZombie
  ){

    target=
      target.parent;
  }


  if(
    !target.userData.isZombie
  ){

    return;
  }


  target.userData.hp--;


  soundHit();


  bloodBurst(
    hits[0].point
  );


  const marker=
    document.getElementById(
      "hitMarker"
    );

  marker.style.opacity="1";


  setTimeout(
    ()=>{
      marker.style.opacity="0";
    },
    90
  );


  /* hit red */

  target.traverse(
    o=>{

      if(
        o.isMesh &&
        o.material &&
        o.material.color
      ){

        o.material=
          o.material.clone();

        o.material.color.set(
          0xff2020
        );
      }

    }
  );


  setTimeout(
    ()=>{

      target.traverse(
        o=>{

          if(
            o.isMesh &&
            o.material &&
            o.material.color
          ){

            const type=
              target.userData.type;


            o.material.color.set(
              type==="runner"
                ? 0x713d38
                : type==="brute"
                  ? 0x556936
                  : 0x718f4b
            );

          }

        }
      );

    },
    90
  );


  if(
    target.userData.hp<=0
  ){

    const idx=
      zombies.indexOf(
        target
      );


    if(
      idx!==-1
    ){

      score +=
        target.userData.type==="brute"
          ? 30
          : target.userData.type==="runner"
            ? 15
            : 10;


      updateHUD();


      setTimeout(
        ()=>{
          scene.remove(
            target
          );
        },
        90
      );


      zombies.splice(
        idx,
        1
      );
    }
  }
}


/* =========================================================
   MOVEMENT
========================================================= */

function move(
  delta
){

  if(!playing)
    return;


  const speed=
    6.5*
    delta;


  const forward=
    new THREE.Vector3(
      Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );


  const right=
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      Math.sin(yaw)
    );


  const dir=
    new THREE.Vector3();


  if(keys.KeyW)
    dir.add(forward);

  if(keys.KeyS)
    dir.sub(forward);

  if(keys.KeyD)
    dir.add(right);

  if(keys.KeyA)
    dir.sub(right);


  if(
    dir.lengthSq()>0
  ){

    dir.normalize();


    camera.position.addScaledVector(
      dir,
      speed
    );


    walkTime +=
      delta*10;


    footstepTimer -=
      delta;


    if(
      footstepTimer<=0
    ){

      soundFootstep();

      footstepTimer=
        .34;
    }

  }else{

    footstepTimer=
      Math.min(
        footstepTimer,
        .15
      );
  }


  camera.position.x=
    Math.max(
      -78,
      Math.min(
        78,
        camera.position.x
      )
    );


  camera.position.z=
    Math.max(
      -90,
      Math.min(
        90,
        camera.position.z
      )
    );


  /* weapon bob */

  if(
    dir.lengthSq()>0
  ){

    weapon.position.y=
      -.43+
      Math.sin(walkTime)*
      .018;


    weapon.position.x=
      .48+
      Math.cos(walkTime*.5)*
      .012;

  }
}


/* =========================================================
   ZOMBIE UPDATE
========================================================= */

function updateZombies(
  delta
){

  const now=
    performance.now()*
    .001;


  for(
    let i=zombies.length-1;
    i>=0;
    i--
  ){

    const z=
      zombies[i];


    if(
      !z.parent
    ){
      continue;
    }


    const dx=
      camera.position.x-
      z.position.x;


    const dz=
      camera.position.z-
      z.position.z;


    const dist=
      Math.max(
        .001,
        Math.hypot(
          dx,
          dz
        )
      );


    if(
      dist>1.75
    ){

      z.position.x +=
        dx/dist*
        z.userData.speed*
        60*
        delta;


      z.position.z +=
        dz/dist*
        z.userData.speed*
        60*
        delta;


      z.rotation.y=
        Math.atan2(
          dx,
          dz
        );


      const p=
        z.userData.parts;


      const walk=
        Math.sin(
          now*7+
          z.userData.phase
        );


      p.armL.rotation.z=
        -.18+
        walk*.32;


      p.armR.rotation.z=
        .18-
        walk*.32;


      p.legL.rotation.x=
        walk*.32;


      p.legR.rotation.x=
        -walk*.32;


      p.body.position.y=
        2+
        Math.abs(walk)*
        .025;


      p.head.position.y=
        3.68+
        Math.abs(walk)*
        .025;

    }
    else{

      z.userData.cooldown -=
        delta;


      if(
        z.userData.cooldown<=0
      ){

        hp -=
          z.userData.type==="brute"
            ? 12
            : z.userData.type==="runner"
              ? 7
              : 8;


        z.userData.cooldown=
          .75;


        soundDamage();


        const overlay=
          document.getElementById(
            "damageOverlay"
          );


        overlay.style.opacity="1";


        setTimeout(
          ()=>{
            overlay.style.opacity="0";
          },
          120
        );


        updateHUD();


        if(
          hp<=0
        ){

          hp=0;

          updateHUD();

          gameOver();

          return;
        }
      }
    }
  }


  /* next wave */

  if(
    playing &&
    zombies.length===0 &&
    !waveSpawning
  ){

    waveSpawning=true;


    nextWaveTimer=
      setTimeout(
        ()=>{

          if(playing){

            wave++;

            updateHUD();

            spawnWave();

          }

          waveSpawning=false;

        },
        1700
      );
  }


  updateHUD();
}


/* =========================================================
   PARTICLES
========================================================= */

function updateParticles(
  delta
){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];


    p.position.x +=
      p.userData.velocity.x*
      delta;


    p.position.y +=
      p.userData.velocity.y*
      delta;


    p.position.z +=
      p.userData.velocity.z*
      delta;


    p.userData.velocity.y -=
      8*delta;


    p.userData.life -=
      delta;


    if(
      p.userData.life<=0
    ){

      scene.remove(p);

      particles.splice(
        i,
        1
      );
    }
  }
}

/* =========================================================
   MOUSE LOOK
========================================================= */

addEventListener(
  "mousemove",
  e=>{

    if(
      !playing ||
      document.pointerLockElement !==
      renderer.domElement
    ){

      return;
    }


    yaw -=
      e.movementX*
      .0025;


    pitch -=
      e.movementY*
      .0025;


    const limit=
      Math.PI/2-.04;


    pitch=
      Math.max(
        -limit,
        Math.min(
          limit,
          pitch
        )
      );


    camera.rotation.y=
      yaw;


    camera.rotation.x=
      pitch;
  }
);

      playing

);

);


/* =========================================================
   CLEAR
========================================================= */

function clearZombies(){

  while(
    zombies.length
  ){

    scene.remove(
      zombies.pop()
    );
  }


  while(
    particles.length
  ){

    scene.remove(
      particles.pop()
    );
  }
}

  if(

      nextWaveTimer
    );

    nextWaveTimer=null;
  }


  if(
    zombieSoundTimer

      zombieSoundTimer
    );

    zombieSoundTimer=null;
  }

  wave=1;

  pitch=0;

    0,
    0
  );


  weapon.position.set(
    .48,

  );

        Coba bertahan lebih lama.
      </div>

    </div>
  `;


  document.getElementById(
    "restartButton"
  ).onclick=
    ()=>{
      location.reload();
    };
}


/* =========================================================
   START BUTTON
========================================================= */

document.getElementById(
  "startButton"
).onclick=
  startGame;


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================================================
   LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );


  move(delta);

  updateZombies(delta);

  updateParticles(delta);


  shootCooldown=
    Math.max(
      0,
      shootCooldown-delta
    );


  recoil=
    Math.max(
      0,
      recoil-delta*3.8
    );


  weapon.position.z=
    -.85+
    recoil;


  weapon.rotation.x=
    -.05+
    recoil*.8;


  renderer.render(
    scene,
    camera
  );
}


updateHUD();

animate();

</script>

</body>
</html>
