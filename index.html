<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zombie Survival 3D</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif
}
canvas{display:block}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:10;
  color:#fff;
  font-size:20px;
  line-height:1.55;
  text-shadow:2px 2px 5px #000;
  pointer-events:none
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:11;

  font-size:30px;

  text-shadow:0 0 6px #000;
  pointer-events:none
}

#start{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;

  align-items:center;

#start h1{

#start p{

}

#start button{

  border:0;

#damageFlash{
  position:fixed;
  inset:0;
  z-index:9;
  background:rgba(255,0,0,.25);

  pointer-events:none
}

#hitFlash{
  position:fixed;
  inset:0;
  z-index:8;
  background:rgba(255,60,0,.08);
  opacity:0;
  pointer-events:none
}
</style>
</head>

<body>

<div id="hud">
❤️ HP: <span id="hp">100</span><br>

🧟 Zombies: <span id="zombies">0</span>
</div>

<div id="crosshair">+</div>
<div id="damageFlash"></div>
<div id="hitFlash"></div>

<div id="start">
  <h1>🧟 ZOMBIE SURVIVAL 3D</h1>
  <p>WASD = bergerak</p>

  <p>Klik kiri = menembak</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.151.3/three.min.js"></script>

<script>

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x091018);

scene.fog =
  new THREE.Fog(
    0x091018,
    35,
    120
  );


/* =========================
   CAMERA
========================= */

const camera =
  new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    200
  );

camera.position.set(
  0,
  1.7,
  0
);

camera.rotation.order="YXZ";


/* =========================
   RENDERER
========================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    2
  )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   LIGHT
========================= */

scene.add(
  new THREE.HemisphereLight(
    0xaabbff,
    0x303020,
    1.25
  )
);

const moon =
  new THREE.DirectionalLight(
    0xdde6ff,
    2
  );

moon.position.set(
  25,
  35,
  10
);

moon.castShadow=true;

moon.shadow.mapSize.set(
  2048,
  2048
);

scene.add(moon);


/* =========================
   GROUND
========================= */

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      200,
      200
    ),
    new THREE.MeshStandardMaterial({
      color:0x75836f,
      roughness:1
    })
  );

ground.rotation.x=
  -Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================
   WALLS
========================= */

const wallMat =
  new THREE.MeshStandardMaterial({
    color:0x25282c,
    roughness:1
  });

function makeWall(
  x,y,z,
  sx,sy,sz
){

  const wall =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        sx,sy,sz
      ),
      wallMat
    );

  wall.position.set(
    x,y,z
  );

  wall.castShadow=true;
  wall.receiveShadow=true;

  scene.add(wall);
}

makeWall(0,5,-90,180,10,2);
makeWall(0,5,90,180,10,2);
makeWall(-90,5,0,2,10,180);
makeWall(90,5,0,2,10,180);

makeWall(
  10,2,-10,
  18,4,3
);

makeWall(
  -18,2,10,
  3,4,18
);

makeWall(
  15,2,20,
  12,4,3
);


/* =========================
   GAME STATE
========================= */

let hp=100;
let score=0;
let wave=1;

let playing=false;

let yaw=0;
let pitch=0;

let fireCooldown=0;
let recoil=0;

let wavePending=false;
let waveTimer=null;

const keys={};

const zombies=[];

const raycaster=
  new THREE.Raycaster();

const clock=
  new THREE.Clock();


/* =========================
   HUD
========================= */

function updateHUD(){

  document.getElementById(
    "hp"
  ).textContent=
    Math.max(0,Math.round(hp));

  document.getElementById(
    "score"
  ).textContent=
    score;

  document.getElementById(
    "wave"
  ).textContent=

  document.getElementById(

/* =========================
   FIRST PERSON WEAPON
========================= */

const weapon=
  new THREE.Group();

camera.add(weapon);

weapon.position.set(
  0.48,
  -0.46,
  -0.88
);

weapon.rotation.set(
  -0.05,
  -0.08,
  0
);


/* materials */

const skinMat =
  new THREE.MeshStandardMaterial({
    color:0xc98968,
    roughness:.9
  });

const sleeveMat =
  new THREE.MeshStandardMaterial({
    color:0x3c4650,
    roughness:1
  });

const gunMat =
  new THREE.MeshStandardMaterial({
    color:0x20242a,
    metalness:.8,
    roughness:.25
  });

const gunDark =
  new THREE.MeshStandardMaterial({
    color:0x0c0f12,
    metalness:.85,
    roughness:.2
  });

const muzzleMat =
  new THREE.MeshBasicMaterial({
    color:0xff9911
  });


function addPart(
  parent,
  geometry,
  material,
  x,y,z,
  rx=0,ry=0,rz=0
){

  const m =
    new THREE.Mesh(
      geometry,
      material
    );

  m.position.set(
    x,y,z
  );

  m.rotation.set(
    rx,ry,rz
  );

  parent.add(m);

  return m;
}


/* right arm */

const rightArm=
  new THREE.Group();

weapon.add(rightArm);

rightArm.position.set(
  .03,
  -.05,
  .02
);

addPart(

  new THREE.CylinderGeometry(

  .12,-.02,.05,

);

addPart(

  ),

);


/* left arm */

const leftArm=

weapon.add(leftArm);

leftArm.position.set(

  .12
);

addPart(
  leftArm,
  new THREE.CylinderGeometry(
    .12,.16,.72,10
  ),
  sleeveMat,

  0,0,.35
);

addPart(

  new THREE.SphereGeometry(
    .18,10,8
  ),

);


/* gun */

weapon.add(gun);

);


/* gun body */

addPart(

  ),

  0,.05,0
);


/* slide */

addPart(
  gun,
  new THREE.BoxGeometry(
    .14,.18,.28
  ),

);


/* grip */

addPart(
  gun,

    .14,.42,.18
  ),
  gunDark,
  0,-.20,.12,

);

addPart(

  new THREE.BoxGeometry(

);


/* muzzle flash */

const muzzle=
  new THREE.Mesh(
    new THREE.SphereGeometry(

muzzle.position.set(

/* =========================
   ZOMBIE MATERIAL
========================= */

const zombieSkin=
  new THREE.MeshStandardMaterial({
    color:0x718d4c,
    roughness:.95
  });

const zombieDark=
  new THREE.MeshStandardMaterial({
    color:0x40532b,
    roughness:1
  });

const zombieShirt=
  new THREE.MeshStandardMaterial({
    color:0x4a5059,
    roughness:1
  });

const zombiePants=
  new THREE.MeshStandardMaterial({
    color:0x20242a,
    roughness:1
  });

const bloodMat=
  new THREE.MeshStandardMaterial({
    color:0x741010,
    roughness:.9
  });

const teethMat=
  new THREE.MeshStandardMaterial({
    color:0xd8d0aa
  });

const zombieEye=
  new THREE.MeshBasicMaterial({
    color:0xff2020
  });

const pupilMat=
  new THREE.MeshBasicMaterial({
    color:0x100000
  });


function zombiePart(
  z,
  geo,
  mat,
  x,y,zz,
  rx=0,ry=0,rz=0
){

  const m=
    new THREE.Mesh(
      geo,
      mat
    );

  m.position.set(
    x,y,zz
  );

  m.rotation.set(
    rx,ry,rz
  );

  m.castShadow=true;

  z.add(m);

  return m;
}


/* =========================
   SPAWN ZOMBIE
========================= */

function spawnZombie(){

  const z=
    new THREE.Group();

  z.userData.isZombie=true;


  /* BODY */

  const body=
    zombiePart(
      z,
      new THREE.BoxGeometry(
        1.3,
        1.7,
        .75
      ),
      zombieShirt,
      0,2,0
    );


  /* ripped shirt */

  zombiePart(
    z,
    new THREE.BoxGeometry(
      .20,.50,.08
    ),
    zombiePants,
    -.36,2.16,.40,
    0,0,-.30
  );

  zombiePart(
    z,
    new THREE.BoxGeometry(
      .15,.32,.08
    ),
    zombiePants,
    .30,1.76,.40,
    0,0,.35
  );


  /* NECK */

  zombiePart(
    z,
    new THREE.CylinderGeometry(
      .27,.31,.30,10
    ),
    zombieSkin,
    0,2.96,0
  );


  /* HEAD */

  const head=
    zombiePart(
      z,
      new THREE.SphereGeometry(
        .72,16,12
      ),
      zombieSkin,
      0,3.70,0
    );

  head.scale.set(
    .92,
    1.05,
    .92
  );


  /* JAW */

  zombiePart(
    z,
    new THREE.BoxGeometry(
      .82,.28,.70
    ),
    zombieSkin,
    0,3.28,.24
  );


  /* EARS */

  zombiePart(
    z,
    new THREE.SphereGeometry(
      .18,10,8
    ),
    zombieSkin,
    -.67,3.68,0
  );

  zombiePart(
    z,
    new THREE.SphereGeometry(
      .18,10,8
    ),
    zombieSkin,
    .67,3.68,0
  );


  /* HAIR */

  for(
    let i=-2;
    i<=2;
    i++
  ){

    zombiePart(
      z,
      new THREE.BoxGeometry(
        .18,.25,.18
      ),
      zombiePants,
      i*.22,
      4.34,
      -.08
    );
  }


  /* EYES */

  zombiePart(
    z,
    new THREE.SphereGeometry(
      .12,10,10
    ),
    zombieEye,
    -.27,3.80,.65
  );

  zombiePart(
    z,
    new THREE.SphereGeometry(
      .12,10,10
    ),
    zombieEye,
    .27,3.80,.65
  );


  /* PUPILS */

  zombiePart(
    z,
    new THREE.SphereGeometry(
      .045,8,8
    ),
    pupilMat,
    -.27,3.80,.76
  );

  zombiePart(
    z,
    new THREE.SphereGeometry(
      .045,8,8
    ),
    pupilMat,
    .27,3.80,.76
  );


  /* NOSE */

  zombiePart(
    z,
    new THREE.BoxGeometry(
      .18,.23,.23
    ),
    zombieDark,
    0,3.54,.73
  );


  /* MOUTH */

  zombiePart(
    z,
    new THREE.BoxGeometry(
      .64,.22,.08
    ),
    bloodMat,
    0,3.29,.72
  );


  /* TEETH */

  for(
    let i=-2;
    i<=2;
    i++
  ){

    zombiePart(
      z,
      new THREE.BoxGeometry(
        .09,.13,.06
      ),
      teethMat,
      i*.11,
      3.35,
      .77
    );
  }


  /* FACE WOUNDS */

  zombiePart(
    z,
    new THREE.BoxGeometry(
      .18,.42,.07
    ),
    bloodMat,
    -.43,3.47,.68,
    0,0,-.35
  );

  zombiePart(
    z,
    new THREE.BoxGeometry(
      .12,.25,.07
    ),
    bloodMat,
    .45,3.96,.62,
    0,0,.45
  );


  /* ARMS */

  const armL=
    zombiePart(
      z,
      new THREE.CylinderGeometry(
        .22,.28,1.50,10
      ),
      zombieSkin,
      -.92,2,0,
      0,0,-.18
    );

  const armR=
    zombiePart(
      z,
      new THREE.CylinderGeometry(
        .22,.28,1.50,10
      ),
      zombieSkin,
      .92,2,0,
      0,0,.18
    );


  /* HANDS */

  zombiePart(
    z,
    new THREE.SphereGeometry(
      .27,10,8
    ),
    zombieDark,
    -1.04,1.22,0
  );

  zombiePart(
    z,
    new THREE.SphereGeometry(
      .27,10,8
    ),
    zombieDark,
    1.04,1.22,0
  );


  /* FINGERS */

  for(
    const side of [-1,1]
  ){

    for(
      let i=0;
      i<3;
      i++
    ){

      zombiePart(
        z,
        new THREE.BoxGeometry(
          .08,.24,.08
        ),
        zombieSkin,
        side*
        (1+(i-1)*.12),
        1.02,
        .12
      );
    }
  }


  /* LEGS */

  const legL=
    zombiePart(
      z,
      new THREE.CylinderGeometry(
        .24,.28,1.5,10
      ),
      zombiePants,
      -.33,.40,0
    );

  const legR=
    zombiePart(
      z,
      new THREE.CylinderGeometry(
        .24,.28,1.5,10
      ),
      zombiePants,
      .33,.40,0
    );


  /* SHOES */

  zombiePart(
    z,
    new THREE.BoxGeometry(
      .50,.28,.85
    ),
    zombiePants,
    -.33,-.47,.18
  );

  zombiePart(
    z,
    new THREE.BoxGeometry(
      .50,.28,.85
    ),
    zombiePants,
    .33,-.47,.18
  );


  /* BODY WOUND */

  zombiePart(
    z,
    new THREE.BoxGeometry(
      .30,.42,.07
    ),
    bloodMat,
    .35,2.25,.40,
    0,0,.25
  );


  /* ANIMATION DATA */

  z.userData.parts={
    body,
    head,
    armL,
    armR,
    legL,
    legR
  };

  z.userData.speed=
    .025+
    Math.random()*.025;

  z.userData.attackCooldown=0;

  z.userData.phase=
    Math.random()*Math.PI*2;


  /* SPAWN */

  const angle=
    Math.random()*Math.PI*2;

  const distance=
    12+
    Math.random()*8;

  z.position.set(
    Math.cos(angle)*distance,
    0,
    Math.sin(angle)*distance
  );


  scene.add(z);

  zombies.push(z);

  updateHUD();
}


/* =========================
   WAVE
========================= */

function spawnWave(){

  let amount=
    3+
    wave*2;

  let spawned=0;

  const timer=
    setInterval(
      ()=>{

        if(!playing){

          clearInterval(timer);

          return;
        }

        spawnZombie();

        spawned++;

        if(
          spawned>=amount
        ){

          clearInterval(
            timer
          );
        }

      },
      450
    );
}


/* =========================
   SHOOT
========================= */

function shoot(){

  if(
    !playing ||
    fireCooldown>0
  ){

    return;
  }


  fireCooldown=.18;

  recoil=.12;

  muzzle.visible=true;

  setTimeout(
    ()=>{
      muzzle.visible=false;
    },
    50
  );


  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );


  const objects=[];


  zombies.forEach(
    z=>{

      z.traverse(
        o=>{

          if(o.isMesh){

            objects.push(o);

          }

        }
      );

    }
  );


  const hit=
    raycaster.intersectObjects(
      objects,
      false
    );


  if(
    hit.length===0
  ){

    return;
  }


  let target=
    hit[0].object;


  while(
    target.parent &&
    !target.userData.isZombie
  ){

    target=
      target.parent;
  }


  if(
    !target.userData.isZombie
  ){

    return;
  }


  /* zombie merah */

  target.traverse(
    o=>{

      if(
        o.isMesh &&
        o.material &&
        o.material.color
      ){

        o.material=
          o.material.clone();

        o.material.color.set(
          0xff0000
        );
      }

    }
  );


  /* flash */

  const flash=
    document.getElementById(
      "hitFlash"
    );

  flash.style.opacity="1";

  setTimeout(
    ()=>{
      flash.style.opacity="0";
    },
    70
  );


  /* remove */

  const index=
    zombies.indexOf(
      target
    );

  if(index!==-1){

    setTimeout(
      ()=>{
        scene.remove(target);
      },
      120
    );

    zombies.splice(
      index,
      1
    );

    score+=10;

    updateHUD();
  }
}


/* =========================
   MOVEMENT
========================= */

function move(){

  if(!playing)return;

  const speed=.13;

  const fx=
    Math.sin(yaw);

  const fz=
    -Math.cos(yaw);

  const rx=
    Math.cos(yaw);

  const rz=
    Math.sin(yaw);


  if(keys.KeyW){

    camera.position.x+=
      fx*speed;

    camera.position.z+=
      fz*speed;
  }


  if(keys.KeyS){

    camera.position.x-=
      fx*speed;

    camera.position.z-=
      fz*speed;
  }


  if(keys.KeyA){

    camera.position.x-=
      rx*speed;

    camera.position.z-=
      rz*speed;
  }


  if(keys.KeyD){

    camera.position.x+=
      rx*speed;

    camera.position.z+=
      rz*speed;
  }


  camera.position.x=
    Math.max(
      -85,
      Math.min(
        85,
        camera.position.x
      )
    );


  camera.position.z=
    Math.max(
      -85,
      Math.min(
        85,
        camera.position.z
      )
    );
}


/* =========================
   ZOMBIE UPDATE
========================= */

function updateZombies(
  delta
){

  const time=
    performance.now()*.001;


  for(
    let i=zombies.length-1;
    i>=0;
    i--
  ){

    const z=
      zombies[i];

    if(!z.parent)continue;


    const dx=
      camera.position.x-
      z.position.x;

    const dz=
      camera.position.z-
      z.position.z;


    const dist=
      Math.max(
        .001,
        Math.hypot(
          dx,
          dz
        )
      );


    if(dist>1.8){

      z.position.x+=
        dx/dist*
        z.userData.speed*
        60*
        delta;

      z.position.z+=
        dz/dist*
        z.userData.speed*
        60*
        delta;

      z.rotation.y=
        Math.atan2(
          dx,
          dz
        );

    }else{

      if(
        z.userData.attackCooldown<=0
      ){

        hp-=8;

        z.userData.attackCooldown=
          .8;


        const flash=
          document.getElementById(
            "damageFlash"
          );

        flash.style.opacity="1";

        setTimeout(
          ()=>{
            flash.style.opacity="0";
          },
          120
        );


        updateHUD();


        if(hp<=0){

          hp=0;

          updateHUD();

          endGame();

          return;
        }
      }
    }


    if(
      z.userData.attackCooldown>0
    ){

      z.userData.attackCooldown-=
        delta;
    }


    /* jalan */

    const p=
      z.userData.parts;

    const w=
      Math.sin(
        time*7+
        z.userData.phase
      );


    p.armL.rotation.z=
      -.18+
      w*.35;

    p.armR.rotation.z=
      .18-
      w*.35;

    p.legL.rotation.x=
      w*.35;

    p.legR.rotation.x=
      -w*.35;


    p.body.position.y=
      2+
      Math.abs(w)*.025;

    p.head.position.y=
      3.70+
      Math.abs(w)*.03;
  }


  /* wave selanjutnya */

  if(
    playing &&
    zombies.length===0 &&
    !wavePending
  ){

    wavePending=true;

    waveTimer=
      setTimeout(
        ()=>{

          if(playing){

            wave++;

            updateHUD();

            spawnWave();
          }

          wavePending=false;

        },
        1500
      );
  }


  updateHUD();
}


/* =========================
   INPUT
========================= */

addEventListener(
  "keydown",
  e=>{
    keys[e.code]=true;
  }
);

addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);


addEventListener(
  "mousemove",
  e=>{

    if(
      !playing ||
      document.pointerLockElement !==
      renderer.domElement
    ){

      return;
    }


    yaw-=
      e.movementX*
      .0025;

    pitch-=
      e.movementY*
      .0025;


    const limit=
      Math.PI/2-
      .05;


    pitch=
      Math.max(
        -limit,
        Math.min(
          limit,
          pitch
        )
      );


    camera.rotation.y=
      yaw;

    camera.rotation.x=
      pitch;
  }
);


/* =========================
   MOUSE
========================= */

renderer.domElement.addEventListener(
  "click",
  ()=>{

    if(
      playing &&
      document.pointerLockElement !==
      renderer.domElement
    ){

      renderer.domElement.requestPointerLock();

    }

  }
);


addEventListener(
  "mousedown",
  e=>{

    if(
      e.button===0
    ){

      shoot();

    }

  }
);


/* =========================
   GAME START
========================= */

function clearZombies(){

  while(
    zombies.length
  ){

    scene.remove(
      zombies.pop()
    );
  }
}


function startGame(){

  clearZombies();


  if(waveTimer){

    clearTimeout(
      waveTimer
    );

    waveTimer=null;
  }


  hp=100;
  score=0;
  wave=1;

  yaw=0;
  pitch=0;

  playing=true;

  camera.position.set(
    0,
    1.7,
    0
  );

  camera.rotation.set(
    0,
    0,
    0
  );


  updateHUD();


  document.getElementById(
    "start"
  ).style.display=
    "none";


  spawnWave();


  renderer.domElement.requestPointerLock();
}


/* =========================
   GAME OVER
========================= */

function endGame(){

  playing=false;


  if(waveTimer){

    clearTimeout(
      waveTimer
    );

    waveTimer=null;
  }


  if(
    document.pointerLockElement
  ){

    document.exitPointerLock();
  }


  const start=
    document.getElementById(
      "start"
    );


  start.style.display=
    "flex";


  start.innerHTML=
    `
    <h1>GAME OVER</h1>
    <p>Score: ${score}</p>
    <p>Wave: ${wave}</p>
    <button id="restart">
      MAIN LAGI
    </button>
    `;


  document.getElementById(
    "restart"
  ).onclick=()=>{

    start.innerHTML=
      `
      <h1>🧟 ZOMBIE SURVIVAL 3D</h1>
      <p>WASD = bergerak</p>
      <p>Mouse = melihat</p>
      <p>Klik kiri = menembak</p>
      <p>ESC = melepas mouse</p>
      <button id="startButton">
        MULAI GAME
      </button>
      `;


    document.getElementById(
      "startButton"
    ).onclick=startGame;

  };
}


/* =========================
   START BUTTON
========================= */

document.getElementById(
  "startButton"
).onclick=startGame;


/* =========================
   LOOP
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );


  move();

  updateZombies(
    delta
  );


  fireCooldown=
    Math.max(
      0,
      fireCooldown-delta
    );


  recoil=
    Math.max(
      0,
      recoil-delta*4
    );


  weapon.position.z=
    -.88+recoil;

  weapon.rotation.x=
    -.05+
    (recoil/.12)*.12;


  renderer.render(
    scene,
    camera
  );
}


updateHUD();

animate();


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>
</body>
</html>
