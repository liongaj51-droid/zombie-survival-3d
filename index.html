<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Survival 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03070b;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  overscroll-behavior:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  left:16px;
  top:16px;
  z-index:20;
  color:#fff;
  text-shadow:0 2px 7px #000;
  pointer-events:none;
}

.hud-title{
  color:#a9b7c7;
  font-size:11px;
  letter-spacing:3px;
  margin-bottom:5px;
}

.hud-row{
  font-size:18px;
  margin:4px 0;
}

#hpWrap{
  width:230px;
  height:10px;
  margin:5px 0 10px;
  background:#14191e;
  border:1px solid #39424b;
  border-radius:20px;
  overflow:hidden;
}

#hpBar{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#26d65b,#aaf15a);
  transition:width .12s;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:26px;
  height:26px;
  transform:translate(-50%,-50%);
  z-index:25;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 5px #000;
}

#crosshair:before{
  width:2px;
  height:24px;
  left:12px;
  top:1px;
}

#crosshair:after{
  width:24px;
  height:2px;
  left:1px;
  top:12px;
}

#hitMarker{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:26;
  color:#ff4545;
  font-size:28px;
  font-weight:bold;
  opacity:0;
  pointer-events:none;
}

#damageFlash{
  position:fixed;
  inset:0;
  z-index:22;
  background:radial-gradient(circle,transparent 38%,rgba(255,0,0,.55));
  opacity:0;
  pointer-events:none;
}

#vignette{
  position:fixed;
  inset:0;
  z-index:10;
  background:radial-gradient(circle,transparent 44%,rgba(0,0,0,.42));

}

/* =========================
   START SCREEN
========================= */

.logo span{

/* =========================================================
   BUILDINGS
========================================================= */

function createBuilding(
  x,
  z,
  w,
  h,
  d,
  color
){

  const group =
    new THREE.Group();

  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      makeMat(color)
    );

  body.position.y =
    h/2;

  body.castShadow = true;
  body.receiveShadow = true;

  group.add(body);


  const cols =
    Math.max(1,Math.floor(w/2.5));

  const rows =
    Math.max(1,Math.floor(h/3));


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      if(Math.random()<.18)
        continue;


      const wx =
        -w/2 +
        1.1 +
        c*2.3;

      const wy =
        1.4 +
        r*2.5;


      if(
        wx>w/2-.5
      )
        continue;


      const window =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            .58,
            .75
          ),
          new THREE.MeshBasicMaterial({
            color:
              Math.random()>.35
                ?0xffc965
                :0x8dc7ff
          })
        );


      window.position.set(
        wx,
        wy,
        d/2+.012
      );

      group.add(window);


      const back =
        window.clone();

      back.position.z =
        -d/2-.012;

      back.rotation.y =
        Math.PI;

      group.add(back);
    }
  }


  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);
}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;
let masterGain = null;


function initAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    masterGain =
      audioCtx.createGain();

    masterGain.gain.value =
      .45;

    masterGain.connect(
      audioCtx.destination
    );
  }


  if(
    audioCtx.state === "suspended"
  ){

    audioCtx.resume();
  }
}


function playTone(
  frequency,
  duration,
  type="sine",
  volume=.08,
  endFrequency=null
){

  if(!audioCtx)
    return;


  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();


  osc.type = type;


  osc.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime
  );


  if(
    endFrequency !== null
  ){

    osc.frequency.exponentialRampToValueAtTime(
      endFrequency,
      audioCtx.currentTime+
      duration
    );
  }


  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+
    duration
  );


  osc.connect(gain);
  gain.connect(masterGain);


  osc.start();

  osc.stop(
    audioCtx.currentTime+
    duration
  );
}


function playNoise(
  duration=.08,
  volume=.12,
  cutoff=1400
){

  if(!audioCtx)
    return;


  const length =
    Math.floor(
      audioCtx.sampleRate*
      duration
    );


  const buffer =
    audioCtx.createBuffer(
      1,
      length,
      audioCtx.sampleRate
    );


  const data =
    buffer.getChannelData(0);


  for(
    let i=0;
    i<length;
    i++
  ){

    data[i] =
      (Math.random()*2-1)*
      (1-i/length);
  }


  const source =
    audioCtx.createBufferSource();

  source.buffer =
    buffer;


  const filter =
    audioCtx.createBiquadFilter();

  filter.type =
    "lowpass";

  filter.frequency.value =
    cutoff;


  const gain =
    audioCtx.createGain();

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+
    duration
  );


  source.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);


  source.start();

  source.stop(
    audioCtx.currentTime+
    duration
  );
}

function weaponPart(
  geo,
  material,
  x,y,z,
  rx=0,
  ry=0,
  rz=0
){

  const mesh =

    );

  mesh.position.set(
    x,y,z
  );

  mesh.rotation.set(
    rx,ry,rz
  );

  weapon.add(mesh);

  return mesh;
}

/* =========================================================
   SHOOT
========================================================= */

function shoot(){

  if(
    !playing ||
    shootCooldown>0
  ){
    return;
  }


  shootCooldown =
    .16;


  recoil =
    .12;


  soundGun();


  muzzle.visible =
    true;


  setTimeout(
    ()=>{
      muzzle.visible =
        false;
    },
    45
  );


  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );


  const targets = [];


  zombies.forEach(
    zombie=>{
      zombie.traverse(
        obj=>{
          if(obj.isMesh)
            targets.push(obj);
        }
      );
    }
  );


  const hits =
    raycaster.intersectObjects(
      targets,
      false
    );


  if(
    hits.length===0
  ){
    return;
  }


  let target =
    hits[0].object;


  while(
    target.parent &&
    !target.userData.isZombie
  ){

    target =
      target.parent;
  }


  if(
    !target.userData.isZombie
  ){
    return;
  }


  target.userData.hp--;


  soundHit();


  bloodBurst(
    hits[0].point
  );


  const marker =
    document.getElementById(
      "hitMarker"
    );


  marker.style.opacity =
    "1";


  setTimeout(
    ()=>{
      marker.style.opacity =
        "0";
    },
    90
  );


  if(
    target.userData.hp<=0
  ){

    const index =
      zombies.indexOf(
        target
      );


    if(index!==-1){

      score +=
        target.userData.type==="brute"
          ?30
          :target.userData.type==="runner"
            ?15
            :10;


      updateHUD();


      setTimeout(
        ()=>{
          scene.remove(
            target
          );
        },
        100
      );


      zombies.splice(
        index,
        1
      );
    }
  }
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(
  delta
){

  if(!playing)
    return;


  const forward =
    new THREE.Vector3(
      Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );


  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      Math.sin(yaw)
    );


  const direction =
    new THREE.Vector3();


  /* keyboard */

  if(keys.KeyW)
    direction.add(forward);

  if(keys.KeyS)
    direction.sub(forward);

  if(keys.KeyD)
    direction.add(right);

  if(keys.KeyA)
    direction.sub(right);


  /* mobile joystick */

  if(
    Math.abs(joyX)>.02 ||
    Math.abs(joyY)>.02
  ){

    direction.addScaledVector(
      right,
      joyX
    );


    direction.addScaledVector(
      forward,
      -joyY
    );
  }


  if(
    direction.lengthSq()>0
  ){

    direction.normalize();


    const speed =
      6.5*
      delta;


    camera.position.addScaledVector(
      direction,
      speed
    );


    walkTime +=
      delta*10;


    footstepTimer -=
      delta;


    if(
      footstepTimer<=0
    ){

      soundStep();

      footstepTimer =
        .34;
    }


    weapon.position.y =
      -.43+
      Math.sin(
        walkTime
      )*.018;


    weapon.position.x =
      .48+
      Math.cos(
        walkTime*.5
      )*.012;

  }


  camera.position.x =
    Math.max(
      -78,
      Math.min(
        78,
        camera.position.x
      )
    );


  camera.position.z =
    Math.max(
      -90,
      Math.min(
        90,
        camera.position.z
      )
    );
}


/* =========================================================
   ZOMBIE UPDATE
========================================================= */

function updateZombies(
  delta
){

  const time =
    performance.now()*.001;


  for(
    let i=zombies.length-1;
    i>=0;
    i--
  ){

    const zombie =
      zombies[i];


    if(
      !zombie.parent
    ){
      continue;
    }


    const dx =
      camera.position.x-
      zombie.position.x;


    const dz =
      camera.position.z-
      zombie.position.z;


    const distance =
      Math.max(
        .001,
        Math.hypot(
          dx,
          dz
        )
      );


    if(
      distance>1.75
    ){

      zombie.position.x +=
        dx/distance*
        zombie.userData.speed*
        60*
        delta;


      zombie.position.z +=
        dz/distance*
        zombie.userData.speed*
        60*
        delta;


      zombie.rotation.y =
        Math.atan2(
          dx,
          dz
        );


      const p =
        zombie.userData.parts;


      const walk =
        Math.sin(
          time*7+
          zombie.userData.phase
        );


      p.armL.rotation.z =
        -.18+
        walk*.32;


      p.armR.rotation.z =
        .18-
        walk*.32;


      p.legL.rotation.x =
        walk*.32;


      p.legR.rotation.x =
        -walk*.32;


      p.body.position.y =
        2+
        Math.abs(walk)*.025;


      p.head.position.y =
        3.68+
        Math.abs(walk)*.025;

    }else{

      zombie.userData.cooldown -=
        delta;


      if(
        zombie.userData.cooldown<=0
      ){

        hp -=
          zombie.userData.type==="brute"
            ?12
            :zombie.userData.type==="runner"
              ?7
              :8;


        zombie.userData.cooldown =
          .75;


        soundDamage();


        const flash =
          document.getElementById(
            "damageFlash"
          );


        flash.style.opacity =
          "1";


        setTimeout(
          ()=>{
            flash.style.opacity =
              "0";
          },
          120
        );


        updateHUD();


        if(
          hp<=0
        ){

          hp=0;

          updateHUD();

          gameOver();

          return;
        }
      }
    }
  }


  if(
    playing &&
    zombies.length===0 &&
    !waveBusy
  ){

    waveBusy =
      true;


    nextWaveTimer =
      setTimeout(
        ()=>{

          if(playing){

            wave++;

            updateHUD();

            spawnWave();
          }


          waveBusy =
            false;

        },
        1700
      );
  }


  updateHUD();
}


/* =========================================================
   PARTICLES
========================================================= */

function updateParticles(
  delta
){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const particle =
      particles[i];


    particle.position.x +=
      particle.userData.velocity.x*
      delta;


    particle.position.y +=
      particle.userData.velocity.y*
      delta;


    particle.position.z +=
      particle.userData.velocity.z*
      delta;


    particle.userData.velocity.y -=
      8*delta;


    particle.userData.life -=
      delta;


    if(
      particle.userData.life<=0
    ){

      scene.remove(
        particle
      );

      particles.splice(
        i,
        1
      );
    }
  }
}

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystickZone =
  document.getElementById(
    "joystickZone"
  );

const joystickKnob =
  document.getElementById(
    "joystickKnob"
  );


function resetJoystick(){

  joyX=0;
  joyY=0;
  joyActive=false;
  joyPointerId=null;


  joystickKnob.style.transform =
    "translate(0px,0px)";
}


function updateJoystick(
  clientX,
  clientY
){

  const rect =
    joystickZone.getBoundingClientRect();


  const centerX =
    rect.left+87;

  const centerY =
    rect.bottom-89;


  let dx =
    clientX-centerX;

  let dy =
    clientY-centerY;


  const distance =
    Math.hypot(
      dx,
      dy
    );


  if(
    distance>JOY_MAX
  ){

    dx =
      dx/distance*
      JOY_MAX;

    dy =
      dy/distance*
      JOY_MAX;
  }


  joyX =
    dx/JOY_MAX;

  joyY =
    dy/JOY_MAX;


  joystickKnob.style.transform =
    `translate(${dx}px,${dy}px)`;
}


joystickZone.addEventListener(
  "pointerdown",
  event=>{

    if(!playing)
      return;


    joyActive=true;

    joyPointerId =
      event.pointerId;


    joystickZone.setPointerCapture(
      event.pointerId
    );


    updateJoystick(
      event.clientX,
      event.clientY
    );


    event.preventDefault();
  }
);


joystickZone.addEventListener(
  "pointermove",
  event=>{

    if(
      !joyActive ||
      event.pointerId!==joyPointerId
    )
      return;


    updateJoystick(
      event.clientX,
      event.clientY
    );


    event.preventDefault();
  }
);


joystickZone.addEventListener(
  "pointerup",
  event=>{

    if(
      event.pointerId===joyPointerId
    ){

      resetJoystick();
    }


    event.preventDefault();
  }
);


joystickZone.addEventListener(
  "pointercancel",
  event=>{

    if(
      event.pointerId===joyPointerId
    ){

      resetJoystick();
    }
  }
);

);

    releaseFire();
    event.preventDefault();
  }
);


fireButton.addEventListener(
  "pointercancel",
  releaseFire
);


fireButton.addEventListener(
  "pointerleave",
  event=>{

    if(
      event.buttons===0
    ){

      releaseFire();
    }
  }
);


/* =========================================================
   CLEAR GAME
========================================================= */

function clearGame(){

  while(
    zombies.length
  ){

    scene.remove(
      zombies.pop()
    );
  }


  while(
    particles.length
  ){

    scene.remove(
      particles.pop()
    );
  }
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

  initAudio();


  clearGame();


  if(nextWaveTimer){

    clearTimeout(
      nextWaveTimer
    );

    nextWaveTimer =
      null;
  }


  if(zombieSoundTimer){

    clearTimeout(
      zombieSoundTimer
    );

    zombieSoundTimer =
      null;
  }


  hp=100;
  score=0;
  wave=1;


  yaw=0;
  pitch=0;


  joyX=0;
  joyY=0;


  fireHeld=false;


  waveBusy=false;


  camera.position.set(
    0,
    1.7,
    8
  );


  camera.rotation.set(
    0,
    0,
    0
  );


  weapon.position.set(
    .48,
    -.43,
    -.85
  );


  updateHUD();


  playing=true;


  document.getElementById(
    "startScreen"
  ).style.display =
    "none";


  spawnWave();


  setTimeout(
    zombieSoundLoop,
    2500
  );


  /* PC pointer lock */
  if(
    window.matchMedia(
      "(min-width:901px)"
    ).matches
  ){

    renderer.domElement.requestPointerLock();
  }
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

  playing=false;

  fireHeld=false;

  resetJoystick();

  resetAim();


  if(nextWaveTimer){

    clearTimeout(
      nextWaveTimer
    );

    nextWaveTimer =
      null;
  }


  if(zombieSoundTimer){

    clearTimeout(
      zombieSoundTimer
    );

    zombieSoundTimer =
      null;
  }


  soundGameOver();


  if(
    document.pointerLockElement
  ){

    document.exitPointerLock();
  }


  const screen =
    document.getElementById(
      "startScreen"
    );


  screen.style.display =
    "flex";


  screen.innerHTML = `
    <div class="startCard">

      <div class="logo">
        GAME <span>OVER</span>
      </div>

      <div class="subtitle">
        NIGHTFALL PROTOCOL TERMINATED
      </div>

      <div class="startInfo">
        🎯 SCORE: ${score}<br>
        🌊 WAVE: ${wave}
      </div>

      <button id="restartButton">
        MAIN LAGI
      </button>

    </div>
  `;


  document.getElementById(
    "restartButton"
  ).onclick = () =>{
    location.reload();
  };
}


/* =========================================================
   START BUTTON
========================================================= */

document.getElementById(
  "startButton"
).onclick =
  startGame;


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  const delta =
    Math.min(
      clock.getDelta(),
      .05
    );


  movePlayer(
    delta
  );


  updateZombies(
    delta
  );


  updateParticles(
    delta
  );


  /* tahan FIRE = auto fire */

  if(
    playing &&
    fireHeld &&
    shootCooldown<=0
  ){

    shoot();
  }


  shootCooldown =
    Math.max(
      0,
      shootCooldown-delta
    );


  recoil =
    Math.max(
      0,
      recoil-delta*3.8
    );


  weapon.position.z =
    -.85+
    recoil;


  weapon.rotation.x =
    -.05+
    recoil*.8;


  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   INIT
========================================================= */

updateHUD();

animate();

</script>
</body>
</html>
