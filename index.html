<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Survival 3D</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#000;font-family:Arial}
#hud{
 position:fixed;top:15px;left:15px;z-index:10;
 color:white;font-size:20px;line-height:1.6;
 text-shadow:2px 2px 4px #000
}
#crosshair{
 position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
 color:white;font-size:30px;z-index:10
}
#start{
 position:fixed;inset:0;z-index:20;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 background:rgba(0,0,0,.8);color:white;text-align:center
}
#start h1{font-size:50px;color:#55ff55}
button{
 padding:15px 35px;font-size:20px;font-weight:bold;
 cursor:pointer;border:0;border-radius:8px
}
</style>
</head>

<body>

<div id="hud">
❤️ HP: <span id="hp">100</span><br>
🎯 Score: <span id="score">0</span><br>
🌊 Wave: <span id="wave">1</span><br>
🧟 Zombies: <span id="count">0</span>
</div>

<div id="crosshair">+</div>

<div id="start">
<h1>🧟 ZOMBIE SURVIVAL 3D</h1>
<p>WASD = bergerak<br>Mouse = melihat<br>Klik kiri = menembak</p>
<button onclick="startGame()">MULAI GAME</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.151.3/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101820);
scene.fog=new THREE.Fog(0x101820,20,100);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,200
);
camera.position.set(0,2,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x222222,1.5));

const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(20,30,10);
light.castShadow=true;
scene.add(light);

/* GROUND */
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(120,120),
new THREE.MeshStandardMaterial({color:0x30352f})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

/* WALLS */
function wall(x,z,sx,sz){
const w=new THREE.Mesh(
new THREE.BoxGeometry(sx,6,sz),
new THREE.MeshStandardMaterial({color:0x222222})
);
w.position.set(x,3,z);
scene.add(w);
}
wall(0,-50,100,1);
wall(0,50,100,1);
wall(-50,0,1,100);
wall(50,0,1,100);

/* PLAYER */
let hp=100;
let score=0;
let wave=1;
let playing=false;
let yaw=0,pitch=0;

camera.rotation.order="YXZ";
scene.add(camera);

/* GUN */
const gun=new THREE.Mesh(
new THREE.BoxGeometry(.25,.25,1),
new THREE.MeshStandardMaterial({color:0x111111})
);
gun.position.set(.35,-.3,-.8);
camera.add(gun);

/* CONTROLS */
const keys={};

onkeydown=e=>keys[e.key.toLowerCase()]=true;
onkeyup=e=>keys[e.key.toLowerCase()]=false;

onmousemove=e=>{
if(!playing)return;

yaw-=e.movementX*.002;
pitch-=e.movementY*.002;

pitch=Math.max(-1.4,Math.min(1.4,pitch));

camera.rotation.y=yaw;
camera.rotation.x=pitch;
};

/* ZOMBIES */
const zombies=[];

function spawnZombie(){

  const z = new THREE.Group();

  // MATERIAL
  const skinMat = new THREE.MeshStandardMaterial({
    color:0x6f8f45,
    roughness:0.9
  });

  const darkSkinMat = new THREE.MeshStandardMaterial({
    color:0x3f5f2a,
    roughness:1
  });

  const shirtMat = new THREE.MeshStandardMaterial({
    color:0x4b4b55,
    roughness:1
  });

  const pantsMat = new THREE.MeshStandardMaterial({
    color:0x22252b,
    roughness:1
  });

  const eyeMat = new THREE.MeshBasicMaterial({
    color:0xff2020
  });

  const bloodMat = new THREE.MeshStandardMaterial({
    color:0x6b1111,
    roughness:1
  });

  // BODY
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.25,1.7,0.75),
    shirtMat
  );
  body.position.y = 2.0;
  z.add(body);

  // HEAD
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(1.15,1.15,1.05),
    skinMat
  );
  head.position.y = 3.45;
  z.add(head);

  // EARS
  const earGeo = new THREE.BoxGeometry(0.18,0.38,0.65);

  const earL = new THREE.Mesh(earGeo,skinMat);
  earL.position.set(-0.63,3.45,0);
  z.add(earL);

  const earR = new THREE.Mesh(earGeo,skinMat);
  earR.position.set(0.63,3.45,0);
  z.add(earR);

  // EYES
  const eyeGeo = new THREE.SphereGeometry(0.11,8,8);

  const eyeL = new THREE.Mesh(eyeGeo,eyeMat);
  eyeL.position.set(-0.22,3.55,0.53);
  z.add(eyeL);

  const eyeR = new THREE.Mesh(eyeGeo,eyeMat);
  eyeR.position.set(0.22,3.55,0.53);
  z.add(eyeR);

  // MOUTH
  const mouth = new THREE.Mesh(
    new THREE.BoxGeometry(0.55,0.16,0.08),
    bloodMat
  );
  mouth.position.set(0,3.18,0.54);
  z.add(mouth);

  // BLOOD / WOUND
  const wound = new THREE.Mesh(
    new THREE.SphereGeometry(0.14,8,8),
    bloodMat
  );
  wound.scale.set(1,1.4,0.5);
  wound.position.set(0.35,3.78,0.48);
  z.add(wound);

  // ARMS
  const armGeo = new THREE.BoxGeometry(0.38,1.55,0.38);

  const armL = new THREE.Mesh(armGeo,skinMat);
  armL.position.set(-0.92,1.95,0);
  armL.rotation.z = -0.18;
  z.add(armL);

  const armR = new THREE.Mesh(armGeo,skinMat);
  armR.position.set(0.92,1.95,0);
  armR.rotation.z = 0.18;
  z.add(armR);

  // HANDS
  const handGeo = new THREE.SphereGeometry(0.22,8,8);

  const handL = new THREE.Mesh(handGeo,darkSkinMat);
  handL.position.set(-1.05,1.18,0);
  z.add(handL);

  const handR = new THREE.Mesh(handGeo,darkSkinMat);
  handR.position.set(1.05,1.18,0);
  z.add(handR);

  // LEGS
  const legGeo = new THREE.BoxGeometry(0.42,1.55,0.48);

  const legL = new THREE.Mesh(legGeo,pantsMat);
  legL.position.set(-0.34,0.35,0);
  z.add(legL);

  const legR = new THREE.Mesh(legGeo,pantsMat);
  legR.position.set(0.34,0.35,0);
  z.add(legR);

  // SHOES
  const shoeGeo = new THREE.BoxGeometry(0.5,0.25,0.8);

  const shoeL = new THREE.Mesh(shoeGeo,pantsMat);
  shoeL.position.set(-0.34,-0.45,0.15);
  z.add(shoeL);

  const shoeR = new THREE.Mesh(shoeGeo,pantsMat);
  shoeR.position.set(0.34,-0.45,0.15);
  z.add(shoeR);

  // RANDOM SPAWN POSITION
  const angle = Math.random() * Math.PI * 2;
  const distance = 25 + Math.random() * 15;

  z.position.set(
    Math.cos(angle) * distance,
    0,
    Math.sin(angle) * distance
  );

  // ZOMBIE SPEED
  z.userData.speed = 0.025 + Math.random() * 0.025;

  scene.add(z);
  zombies.push(z);
}
const z=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(.8,1.2,.5),
new THREE.MeshStandardMaterial({color:0x3c7a3c})
);
body.position.y=1.1;
z.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.38,16,16),
new THREE.MeshStandardMaterial({color:0x719c54})
);
head.position.y=2;
z.add(head);

const eyeMat=new THREE.MeshBasicMaterial({color:0xff0000});

for(let x of [-.13,.13]){
const eye=new THREE.Mesh(
new THREE.SphereGeometry(.06,8,8),
eyeMat
);
eye.position.set(x,2.05,-.33);
z.add(eye);
}

const angle=Math.random()*Math.PI*2;
const distance=25+Math.random()*15;

z.position.set(
Math.cos(angle)*distance,
0,
Math.sin(angle)*distance
);

z.userData.speed=.025+Math.random()*.025;
z.userData.cooldown=0;

scene.add(z);
zombies.push(z);
}

/* WAVE */
function spawnWave(){

let amount=3+wave*2;
let spawned=0;

const timer=setInterval(()=>{

if(!playing){
clearInterval(timer);
return;
}

spawnZombie();
spawned++;

if(spawned>=amount)
clearInterval(timer);

},500);
}

/* SHOOT */
const raycaster=new THREE.Raycaster();

onmousedown=e=>{

if(!playing||e.button!==0)return;

raycaster.setFromCamera(
new THREE.Vector2(0,0),
camera
);

let objects=[];

zombies.forEach(z=>{
z.traverse(o=>{
if(o.isMesh)objects.push(o);
});
});

const hit=raycaster.intersectObjects(objects);

if(hit.length){

let target=hit[0].object;

while(target.parent&&!zombies.includes(target))
target=target.parent;

if(zombies.includes(target)){
target.traverse(o=>{
  if(o.isMesh && o.material && o.material.color){
    o.material=o.material.clone();
    o.material.color.set(0xff0000);
  }
});

setTimeout(()=>{
  scene.remove(target);
},120);
zombies.splice(zombies.indexOf(target),1);
score+=10;
updateHUD();
}
}
};

/* PLAYER MOVEMENT */
function move(){

const dir=new THREE.Vector3();

if(keys.w)dir.z-=1;
if(keys.s)dir.z+=1;
if(keys.a)dir.x-=1;
if(keys.d)dir.x+=1;

if(dir.length()){

dir.normalize();

dir.applyAxisAngle(
new THREE.Vector3(0,1,0),yaw
);

camera.position.x+=dir.x*.15;
camera.position.z+=dir.z*.15;
}

camera.position.x=
THREE.MathUtils.clamp(camera.position.x,-47,47);

camera.position.z=
THREE.MathUtils.clamp(camera.position.z,-47,47);
}

/* ZOMBIE AI */
function updateZombies(){

zombies.forEach(z=>{

const dx=camera.position.x-z.position.x;
const dz=camera.position.z-z.position.z;
const distance=Math.sqrt(dx*dx+dz*dz);

if(distance>1.5){

z.position.x+=(dx/distance)*z.userData.speed;
z.position.z+=(dz/distance)*z.userData.speed;
}

z.lookAt(camera.position.x,z.position.y,camera.position.z);

if(distance<2&&z.userData.cooldown<=0){

hp-=8;
z.userData.cooldown=50;
updateHUD();

if(hp<=0)gameOver();
}

if(z.userData.cooldown>0)
z.userData.cooldown--;
});
}

/* HUD */
function updateHUD(){
document.getElementById("hp").textContent=Math.max(0,hp);
document.getElementById("score").textContent=score;
document.getElementById("wave").textContent=wave;
document.getElementById("count").textContent=zombies.length;
}

/* START */
function startGame(){

playing=true;
document.getElementById("start").style.display="none";

document.body.requestPointerLock();

spawnWave();
}

/* GAME OVER */
function gameOver(){

playing=false;

if(document.pointerLockElement)
document.exitPointerLock();

document.getElementById("start").style.display="flex";

document.getElementById("start").innerHTML=`
<h1>💀 GAME OVER</h1>
<p>Score: ${score}</p>
<button onclick="location.reload()">MAIN LAGI</button>
`;
}

/* NEXT WAVE */
setInterval(()=>{

if(playing&&zombies.length===0){

wave++;
updateHUD();
spawnWave();

}

},2000);

/* RESIZE */
onresize=()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);

};

/* LOOP */
function animate(){

requestAnimationFrame(animate);

if(playing){
move();
updateZombies();
updateHUD();
}

renderer.render(scene,camera);
}

updateHUD();
animate();
</script>

</body>
</html>
