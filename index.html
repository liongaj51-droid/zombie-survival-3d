function wall(x,z,sx,sz){
const w=new THREE.Mesh(
new THREE.BoxGeometry(sx,6,sz),
new THREE.MeshStandardMaterial({color:0x222222})
);
w.position.set(x,3,z);
scene.add(w);

new THREE.MeshStandardMaterial({color:0x111111})

yaw-=e.movementX*.002;
pitch-=e.movementY*.002;

pitch=Math.max(-1.4,Math.min(1.4,pitch));

camera.rotation.y=yaw;
camera.rotation.x=pitch;

eyeMat
);

}

const angle=Math.random()*Math.PI*2;
const distance=25+Math.random()*15;

z.position.set(
Math.cos(angle)*distance,
0,

);

/* WAVE */
function spawnWave(){

let amount=3+wave*2;
let spawned=0;

const timer=setInterval(()=>{

if(!playing){
clearInterval(timer);
return;
}

spawnZombie();
spawned++;

if(spawned>=amount)
clearInterval(timer);

},500);
}

/* SHOOT */
const raycaster=new THREE.Raycaster();

onmousedown=e=>{

if(!playing||e.button!==0)return;

raycaster.setFromCamera(
new THREE.Vector2(0,0),
camera
);

let objects=[];

zombies.forEach(z=>{
z.traverse(o=>{
if(o.isMesh)objects.push(o);
});
});

const hit=raycaster.intersectObjects(objects);

if(hit.length){

let target=hit[0].object;

while(target.parent&&!zombies.includes(target))
target=target.parent;

if(zombies.includes(target)){
target.traverse(o=>{
  if(o.isMesh && o.material && o.material.color){
    o.material=o.material.clone();
    o.material.color.set(0xff0000);
  }
});

setTimeout(()=>{
  scene.remove(target);
},120);
zombies.splice(zombies.indexOf(target),1);
score+=10;
updateHUD();
}
}
};

/* PLAYER MOVEMENT */
function move(){

const dir=new THREE.Vector3();

if(keys.w)dir.z-=1;
if(keys.s)dir.z+=1;
if(keys.a)dir.x-=1;
if(keys.d)dir.x+=1;

if(dir.length()){

dir.normalize();

dir.applyAxisAngle(
new THREE.Vector3(0,1,0),yaw
);

camera.position.x+=dir.x*.15;
camera.position.z+=dir.z*.15;
}

camera.position.x=
THREE.MathUtils.clamp(camera.position.x,-47,47);

camera.position.z=
THREE.MathUtils.clamp(camera.position.z,-47,47);
}

/* ZOMBIE AI */
function updateZombies(){

zombies.forEach(z=>{

const dx=camera.position.x-z.position.x;
const dz=camera.position.z-z.position.z;
const distance=Math.sqrt(dx*dx+dz*dz);

if(distance>1.5){

z.position.x+=(dx/distance)*z.userData.speed;
z.position.z+=(dz/distance)*z.userData.speed;
}

z.lookAt(camera.position.x,z.position.y,camera.position.z);

if(distance<2&&z.userData.cooldown<=0){

hp-=8;
z.userData.cooldown=50;
updateHUD();

if(hp<=0)gameOver();
}

if(z.userData.cooldown>0)
z.userData.cooldown--;
});
}

/* HUD */
function updateHUD(){
document.getElementById("hp").textContent=Math.max(0,hp);
document.getElementById("score").textContent=score;
document.getElementById("wave").textContent=wave;
document.getElementById("count").textContent=zombies.length;
}

/* START */
function startGame(){

playing=true;
document.getElementById("start").style.display="none";

document.body.requestPointerLock();

spawnWave();
}

/* GAME OVER */
function gameOver(){

playing=false;

if(document.pointerLockElement)
document.exitPointerLock();

document.getElementById("start").style.display="flex";

document.getElementById("start").innerHTML=`
<h1>💀 GAME OVER</h1>
<p>Score: ${score}</p>
<button onclick="location.reload()">MAIN LAGI</button>
`;
}

/* NEXT WAVE */
setInterval(()=>{

if(playing&&zombies.length===0){

wave++;
updateHUD();
spawnWave();

}

},2000);

/* RESIZE */
onresize=()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);

};

/* LOOP */
function animate(){

requestAnimationFrame(animate);

if(playing){
move();
updateZombies();
updateHUD();
}

renderer.render(scene,camera);
}

updateHUD();
animate();
</script>
